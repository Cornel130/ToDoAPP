<div class="audit-logs-container">
  <div class="header">
    <h2>Audit Logs</h2>
    <button class="back-btn" (click)="goBack()">Back to Dashboard</button>
  </div>

  <div *ngIf="loading" class="loading">
    Loading logs...
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && logs.length === 0" class="no-logs">
    No audit logs found.
  </div>

  <table *ngIf="!loading && logs.length > 0" class="logs-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Timestamp</th>
        <th>Username</th>
        <th>Action</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs">
        <td>{{ log.id }}</td>
        <td>{{ log.timestamp | date:'short' }}</td>
        <td>{{ log.username }}</td>
        <td><span class="action-badge" [ngClass]="getBadgeClass(log.action)">{{ log.action }}</span></td>
        <td>{{ log.details }}</td>
      </tr>
    </tbody>
  </table>
</div>
