<div class="edit-task-container">
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="edit-task-form">
    <h2>Editează Task</h2>

    <div class="form-group">
      <label for="title">Titlu:</label>
      <input id="title" type="text" formControlName="title" />
      <div *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched" class="error">
        Titlul este obligatoriu.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Descriere:</label>
      <textarea id="description" formControlName="description"></textarea>
    </div>

    <div class="form-group">
      <label for="deadline">Deadline:</label>
      <input id="deadline" type="date" formControlName="deadline" [min]="minDate" />
      <div *ngIf="taskForm.get('deadline')?.invalid && taskForm.get('deadline')?.touched" class="error">
        Deadline-ul este obligatoriu.
      </div>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" formControlName="status" />
        Finalizat
      </label>
    </div>

    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="taskForm.invalid">Salvează</button>
  </form>
</div>
