<div class="dashboard-container">
  <div class="dashboard-header">
    <h2>Taskurile tale</h2>

    <div class="header-buttons">
      <button class="btn-add-task" (click)="toggleAddTask()">Add new task</button>
      <button class="btn-sort" (click)="sortByDeadline()">Sortare</button>
      <button *ngIf="!mfaEnabled" class="btn-mfa-enable" (click)="enableMfa()">Activează MFA</button>
      <button *ngIf="mfaEnabled" class="btn-mfa-disable" (click)="disableMfa()">Dezactivează MFA</button>
      <button *ngIf="isAdmin" class="btn-audit-logs" routerLink="/audit-logs">Audit Logs</button>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </div>

  <div *ngIf="showAddForm" class="add-task-form">
    <h3>Adaugă un nou task</h3>

    <form (ngSubmit)="submitTask()" #taskForm="ngForm">
      <input
        type="text"
        name="title"
        [(ngModel)]="newTask.title"
        placeholder="Titlu"
        required
      />

      <textarea
        name="description"
        [(ngModel)]="newTask.description"
        placeholder="Descriere"
        required
      ></textarea>

      <input
        type="date"
        name="deadline"
        [(ngModel)]="newTask.deadline"
        [min]="minDate"
        required
      />

      <button type="submit" class="btn-submit" [disabled]="taskForm.invalid">
        Submit
      </button>
    </form>

    <div *ngIf="errorMessage" class="form-error">
      {{ errorMessage }}
    </div>
  </div>

  <div *ngIf="tasks.length === 0" class="empty-message">
    Nu ai niciun task atribuit.
  </div>

  <table *ngIf="tasks.length > 0" class="task-table">
    <thead>
    <tr>
      <th>Titlu</th>
      <th>Descriere</th>
      <th>Deadline</th>
      <th>Status</th>
      <th>Acțiuni</th>
    </tr>
    </thead>

    <tbody>
    <tr
      *ngFor="let task of tasks"
      [class.completed]="task.status"
      [class.pending]="!task.status"
    >
      <td>{{ task.title }}</td>
      <td>{{ task.description }}</td>
      <td>{{ task.deadline | date:'dd/MM/yyyy' }}</td>
      <td>
          <span [ngClass]="task.status ? 'badge-done' : 'badge-pending'">
            {{ task.status ? 'Finalizat' : 'În desfășurare' }}
          </span>
      </td>
      <td class="actions-cell">
        <button (click)="deleteTask(task.id)" class="btn-delete">Șterge</button>
        <button (click)="editTask(task.id)" class="btn-edit">Editează</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
